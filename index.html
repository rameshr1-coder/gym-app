<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PPL & Bag Workout Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            overscroll-behavior-y: contain;
            -webkit-tap-highlight-color: transparent; 
        }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-slate-900 h-[100dvh] flex justify-center">

    <div class="w-full h-full max-w-md bg-slate-50 relative flex flex-col shadow-2xl overflow-hidden font-sans">
        
        <!-- ================= VIEW: DASHBOARD ================= -->
        <div id="view-dashboard" class="view-section flex-1 overflow-y-auto p-6 pb-28 w-full hidden">
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight mb-6">Train.</h1>
            
            <div class="grid grid-cols-3 gap-3">
                <button onclick="startWorkout('Push')" class="bg-white border border-slate-200 shadow-sm p-4 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-red-400 hover:shadow-md transition-all active:scale-95 group">
                    <div class="bg-red-50 p-3 rounded-full text-red-600 group-hover:bg-red-100 transition-colors"><i class="ph-fill ph-hand-fist text-2xl"></i></div>
                    <span class="font-bold text-slate-800 text-sm">Push</span>
                </button>
                <button onclick="startWorkout('Pull')" class="bg-white border border-slate-200 shadow-sm p-4 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-blue-400 hover:shadow-md transition-all active:scale-95 group">
                    <div class="bg-blue-50 p-3 rounded-full text-blue-600 group-hover:bg-blue-100 transition-colors"><i class="ph-fill ph-hand-grabbing text-2xl"></i></div>
                    <span class="font-bold text-slate-800 text-sm">Pull</span>
                </button>
                <button onclick="startWorkout('Legs')" class="bg-white border border-slate-200 shadow-sm p-4 rounded-2xl flex flex-col items-center justify-center gap-2 hover:border-green-400 hover:shadow-md transition-all active:scale-95 group">
                    <div class="bg-green-50 p-3 rounded-full text-green-600 group-hover:bg-green-100 transition-colors"><i class="ph-fill ph-person text-2xl"></i></div>
                    <span class="font-bold text-slate-800 text-sm">Legs</span>
                </button>
            </div>
            
            <!-- Backup & Restore Section -->
            <div class="mt-8 p-5 bg-slate-800 rounded-2xl shadow-lg border border-slate-700">
                <h3 class="text-white font-bold mb-3 flex items-center text-lg">
                    <i class="ph-fill ph-database mr-2 text-blue-400"></i> Backup & Restore
                </h3>
                <div class="flex gap-3">
                    <button onclick="exportWorkoutData()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-3 px-2 rounded-xl font-bold shadow-sm transition-colors flex justify-center items-center gap-2 text-sm">
                        <i class="ph-bold ph-download-simple"></i> Export
                    </button>
                    <label class="flex-1 bg-slate-600 hover:bg-slate-500 text-white py-3 px-2 rounded-xl font-bold shadow-sm transition-colors text-center cursor-pointer flex justify-center items-center gap-2 text-sm">
                        <i class="ph-bold ph-upload-simple"></i> Import
                        <input type="file" accept=".json" onchange="importWorkoutData(event)" class="hidden" />
                    </label>
                </div>
                <p class="text-slate-400 text-xs mt-3 leading-relaxed">Export your data to a file before clearing history or switching phones to keep your PBs safe.</p>
            </div>

            <!-- History List -->
            <h2 class="text-xl font-bold text-slate-800 pt-8 mb-4">Recent Sessions</h2>
            <div id="history-list" class="space-y-3"></div>
        </div>

        <!-- ================= VIEW: ACTIVE WORKOUT ================= -->
        <div id="view-active-workout" class="view-section hidden flex-1 flex flex-col w-full bg-slate-50 overflow-hidden">
            <div id="active-workout-container" class="flex-1 overflow-y-auto h-full"></div>
        </div>

        <!-- ================= VIEW: BAG WORKOUT ================= -->
        <div id="view-bag" class="view-section hidden flex-1 overflow-y-auto p-4 pb-28 w-full bg-slate-50">
            <div class="flex items-center gap-3 mb-6">
                <div class="bg-purple-100 p-2 rounded-xl">
                    <i class="ph-bold ph-fist text-purple-600 text-2xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Bag Work</h1>
            </div>
            
            <div id="bag-content-container"></div>
        </div>

        <!-- ================= VIEW: PBs ================= -->
        <div id="view-pbs" class="view-section hidden flex-1 overflow-y-auto p-4 pb-28 w-full bg-slate-50">
            <div class="flex items-center gap-3 mb-6">
                <div class="bg-amber-100 p-2 rounded-xl">
                    <i class="ph-bold ph-trophy text-amber-600 text-2xl"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Progress</h1>
            </div>
            
            <div id="pb-content-container"></div>
        </div>

        <!-- ================= BOTTOM NAVIGATION ================= -->
        <div id="bottom-nav" class="absolute bottom-0 w-full bg-white border-t border-slate-200 px-6 pt-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))] flex justify-between items-center shadow-[0_-4px_20px_rgba(0,0,0,0.05)] z-40">
            <button id="nav-workouts" onclick="switchTab('dashboard')" class="nav-btn flex flex-col items-center gap-1 transition-colors text-blue-600">
                <i class="ph-fill ph-barbell text-2xl"></i>
                <span class="text-[10px] font-bold">Log</span>
            </button>
            
            <button id="nav-bag" onclick="switchTab('bag')" class="nav-btn flex flex-col items-center gap-1 transition-colors text-slate-400 hover:text-slate-600">
                <i class="ph-bold ph-fist text-2xl"></i>
                <span class="text-[10px] font-bold">Bag</span>
            </button>
            
            <button id="nav-pbs" onclick="switchTab('pbs')" class="nav-btn flex flex-col items-center gap-1 transition-colors text-slate-400 hover:text-slate-600">
                <i class="ph-bold ph-trophy text-2xl"></i>
                <span class="text-[10px] font-bold">PBs</span>
            </button>
        </div>
        
        <!-- ================= MODAL OVERLAY ================= -->
        <div id="modal-overlay" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
            <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl overflow-y-auto max-h-[80vh]" id="modal-content"></div>
        </div>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        const DEFAULT_EXERCISES = {
            Push: ['Barbell Bench Press', 'Incline Dumbbell Press', 'Overhead Press', 'Lateral Raises', 'Tricep Pushdowns', 'Skull Crushers'],
            Pull: ['Barbell Deadlift', 'Pull-ups', 'Bent Over Rows', 'Barbell Curls', 'Face Pulls', 'Shrugs'],
            Legs: ['Barbell Squat', 'Leg Press', 'Leg Curl', 'Leg Extension', 'Calf Raises', 'Romanian Deadlift']
        };

        let historyData = [];
        let lastWorkoutTemplate = { Push: null, Pull: null, Legs: null };
        let currentWorkout = null;
        let pbChartInstance = null;

        function loadData() {
            const h = localStorage.getItem('workoutHistory');
            const t = localStorage.getItem('lastWorkoutTemplate');
            historyData = h ? JSON.parse(h) : [];
            lastWorkoutTemplate = t ? JSON.parse(t) : { Push: null, Pull: null, Legs: null };
        }

        function saveData() {
            localStorage.setItem('workoutHistory', JSON.stringify(historyData));
            localStorage.setItem('lastWorkoutTemplate', JSON.stringify(lastWorkoutTemplate));
        }

        function startWorkout(type) {
            currentWorkout = { id: Date.now().toString(), type, date: new Date().toISOString(), exercises: [] };
            renderActiveWorkout(type);
        }

        function renderActiveWorkout(type) {
            switchTab('active-workout');
            const container = document.getElementById('active-workout-container');
            const template = lastWorkoutTemplate[type];
            const exercises = template ? template.exercises.map(e => e.name) : DEFAULT_EXERCISES[type];
            
            let html = `
                <div class="flex flex-col h-full bg-slate-50">
                    <div class="flex items-center justify-between bg-white border-b border-slate-200 p-6 sticky top-0 z-10">
                        <div>
                            <h2 class="text-2xl font-extrabold text-slate-900">${type}</h2>
                            <p class="text-xs text-slate-500 mt-1">${new Date().toLocaleDateString('en-GB')}</p>
                        </div>
                        <button onclick="finishWorkout()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                            <i class="ph-bold ph-check mr-2"></i> Finish
                        </button>
                    </div>
                    <div class="flex-1 overflow-y-auto pb-20">
            `;

            exercises.forEach((exName, idx) => {
                const lastSets = template ? (template.exercises.find(e => e.name === exName)?.sets || []) : [];
                html += `
                    <div class="bg-white border-b border-slate-200 px-6 py-4">
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="font-bold text-slate-900">${exName}</h3>
                            <button onclick="showSwapModal(${idx}, '${type}')" class="text-slate-400 hover:text-slate-600">
                                <i class="ph-bold ph-swap text-lg"></i>
                            </button>
                        </div>
                        <div id="ex-${idx}-sets" class="space-y-2"></div>
                        <button onclick="addSetUI(${idx})" class="mt-3 text-sm text-blue-600 hover:text-blue-700 font-bold flex items-center gap-1">
                            <i class="ph-bold ph-plus text-lg"></i> Add Set
                        </button>
                    </div>
                `;
            });

            html += `
                    <div class="bg-white border-b border-slate-200 px-6 py-4">
                        <button onclick="addNewExerciseUI('${type}')" class="w-full text-center text-slate-500 hover:text-slate-700 font-bold py-2 flex items-center justify-center gap-2 border-2 border-dashed border-slate-300 rounded-lg transition-colors">
                            <i class="ph-bold ph-plus text-lg"></i> Add Exercise
                        </button>
                    </div>
                </div></div>
            `;
            container.innerHTML = html;
            
            // Populate sets
            exercises.forEach((exName, idx) => {
                const template = lastWorkoutTemplate[type];
                const lastSets = template ? (template.exercises.find(e => e.name === exName)?.sets || []) : [];
                renderSetsForExercise(idx, lastSets);
            });
        }

        function renderSetsForExercise(exIdx, sets) {
            const container = document.getElementById(`ex-${exIdx}-sets`);
            if (!container) return;
            
            let html = sets.map((s, setIdx) => `
                <div class="flex gap-2">
                    <input type="number" placeholder="Wt" value="${s.w || ''}" data-ex="${exIdx}" data-set="${setIdx}" class="w-1/3 bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm outline-none focus:border-blue-500">
                    <input type="number" placeholder="Reps" value="${s.r || ''}" data-ex="${exIdx}" data-set="${setIdx}" class="w-1/3 bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm outline-none focus:border-blue-500">
                    <input type="number" placeholder="Sets" value="${s.s || ''}" data-ex="${exIdx}" data-set="${setIdx}" class="w-1/3 bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm outline-none focus:border-blue-500">
                    <button onclick="removeSetUI(${exIdx}, ${setIdx})" class="text-slate-400 hover:text-red-600">
                        <i class="ph-bold ph-x text-lg"></i>
                    </button>
                </div>
            `).join('');
            
            container.innerHTML = html;
        }

        function addSetUI(exIdx) {
            const container = document.getElementById(`ex-${exIdx}-sets`);
            const count = container.children.length;
            const div = document.createElement('div');
            div.className = 'flex gap-2';
            div.innerHTML = `
                <input type="number" placeholder="Wt" data-ex="${exIdx}" data-set="${count}" class="w-1/3 bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm outline-none focus:border-blue-500">
                <input type="number" placeholder="Reps" data-ex="${exIdx}" data-set="${count}" class="w-1/3 bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm outline-none focus:border-blue-500">
                <input type="number" placeholder="Sets" data-ex="${exIdx}" data-set="${count}" class="w-1/3 bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm outline-none focus:border-blue-500">
                <button onclick="removeSetUI(${exIdx}, ${count})" class="text-slate-400 hover:text-red-600">
                    <i class="ph-bold ph-x text-lg"></i>
                </button>
            `;
            container.appendChild(div);
        }

        function removeSetUI(exIdx, setIdx) {
            const container = document.getElementById(`ex-${exIdx}-sets`);
            if (container.children[setIdx]) {
                container.children[setIdx].remove();
            }
        }

        function addNewExerciseUI(type) {
            const defaults = DEFAULT_EXERCISES[type];
            const options = defaults.map(e => `<option value="${e}">${e}</option>`).join('');
            
            document.getElementById('modal-content').innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-4">Add New Exercise</h2>
                <label class="block text-sm font-bold text-slate-700 mb-2">Choose Exercise</label>
                <select id="new-ex-select" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 mb-4 font-semibold outline-none">
                    ${options}
                </select>
                <button onclick="confirmAddNewExercise('${type}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl">
                    Add Exercise
                </button>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
        }

        function confirmAddNewExercise(type) {
            const val = document.getElementById('new-ex-select').value;
            if (val) {
                const scrollContainer = document.querySelector('#view-active-workout .flex-1');
                if (scrollContainer) {
                    const existingExercises = scrollContainer.querySelectorAll('h3');
                    const count = existingExercises.length;
                    
                    const div = document.createElement('div');
                    div.className = 'bg-white border-b border-slate-200 px-6 py-4';
                    div.innerHTML = `
                        <div class="flex items-center justify-between mb-3">
                            <h3 class="font-bold text-slate-900">${val}</h3>
                            <button onclick="showSwapModal(${count}, '${type}')" class="text-slate-400 hover:text-slate-600">
                                <i class="ph-bold ph-swap text-lg"></i>
                            </button>
                        </div>
                        <div id="ex-${count}-sets" class="space-y-2"></div>
                        <button onclick="addSetUI(${count})" class="mt-3 text-sm text-blue-600 hover:text-blue-700 font-bold flex items-center gap-1">
                            <i class="ph-bold ph-plus text-lg"></i> Add Set
                        </button>
                    `;
                    
                    const addButton = scrollContainer.querySelector('button:has(i.ph-plus)').parentElement;
                    scrollContainer.insertBefore(div, addButton);
                }
                document.getElementById('modal-overlay').classList.add('hidden');
            }
        }

        function showSwapModal(exIdx, type) {
            const allEx = DEFAULT_EXERCISES[type];
            const current = document.querySelector(`#ex-${exIdx}-sets`).previousElementSibling.querySelector('h3').textContent;
            const options = allEx.filter(e => e !== current).map(e => `<option value="${e}">${e}</option>`).join('');
            
            document.getElementById('modal-content').innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-4">Swap Exercise</h2>
                <select id="swap-select" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 mb-4">
                    <option value="">Choose...</option>
                    ${options}
                </select>
                <button onclick="confirmSwap(${exIdx})" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl">
                    Confirm
                </button>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
        }

        function confirmSwap(exIdx) {
            const val = document.getElementById('swap-select').value;
            if (val) {
                const header = document.querySelector(`#ex-${exIdx}-sets`).previousElementSibling.querySelector('h3');
                header.textContent = val;
                document.getElementById('modal-overlay').classList.add('hidden');
            }
        }

        function finishWorkout() {
            const exercises = [];
            document.querySelectorAll('[data-ex]').forEach(inp => {
                const exIdx = inp.dataset.ex;
                const exName = document.querySelector(`#ex-${exIdx}-sets`).previousElementSibling.querySelector('h3').textContent;
                
                if (!exercises.find(e => e.name === exName)) {
                    exercises.push({ name: exName, sets: [] });
                }
                
                const ex = exercises.find(e => e.name === exName);
                const setIdx = parseInt(inp.dataset.set);
                if (!ex.sets[setIdx]) ex.sets[setIdx] = { w: null, r: null, s: null };
                
                if (inp.className.includes('p-2')) {
                    const inputs = inp.parentElement.querySelectorAll('input[type="number"]');
                    ex.sets[setIdx].w = inputs[0].value ? parseInt(inputs[0].value) : null;
                    ex.sets[setIdx].r = inputs[1].value ? parseInt(inputs[1].value) : null;
                    ex.sets[setIdx].s = inputs[2].value ? parseInt(inputs[2].value) : null;
                }
            });

            const workout = { ...currentWorkout, exercises };
            historyData.unshift(workout);
            lastWorkoutTemplate[currentWorkout.type] = workout;
            saveData();
            switchTab('dashboard');
            renderHistory();
            showMessage("Success", `${currentWorkout.type} workout logged!`);
        }

        function renderHistory() {
            const container = document.getElementById('history-list');
            if (historyData.length === 0) {
                container.innerHTML = '<p class="text-slate-500 text-sm">No sessions yet</p>';
                return;
            }
            
            container.innerHTML = historyData.slice(0, 10).map((s, i) => `
                <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="font-bold text-slate-900">${s.type}</h3>
                        <span class="text-xs text-slate-500">${new Date(s.date).toLocaleDateString('en-GB')}</span>
                    </div>
                    <p class="text-sm text-slate-600 mb-3">${s.exercises.length} exercises</p>
                    <div class="flex gap-2">
                        <button onclick="viewSessionDetails(${i})" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-600 font-bold py-2 px-3 rounded-lg text-sm">
                            <i class="ph-bold ph-eye"></i> View
                        </button>
                        <button onclick="deleteSession(${i})" class="flex-1 bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2 px-3 rounded-lg text-sm">
                            <i class="ph-bold ph-trash"></i> Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function viewSessionDetails(idx) {
            const s = historyData[idx];
            const exHTML = s.exercises.map(e => `
                <div class="border-b border-slate-200 pb-4 mb-4 last:border-b-0">
                    <h4 class="font-bold text-slate-900 mb-2">${e.name}</h4>
                    <div class="space-y-1 text-sm text-slate-600">
                        ${e.sets.map((st, j) => `<div>Set ${j + 1}: ${st.w || '-'} kg × ${st.r || '-'} reps × ${st.s || '-'} sets</div>`).join('')}
                    </div>
                </div>
            `).join('');
            
            document.getElementById('modal-content').innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">${s.type}</h2>
                <p class="text-sm text-slate-500 mb-4">${new Date(s.date).toLocaleDateString('en-GB')}</p>
                <div class="max-h-96 overflow-y-auto mb-4">${exHTML}</div>
                <button onclick="document.getElementById('modal-overlay').classList.add('hidden')" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-900 font-bold py-2 rounded-lg">Close</button>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
        }

        function deleteSession(idx) {
            if (confirm('Delete this session?')) {
                historyData.splice(idx, 1);
                saveData();
                renderHistory();
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            
            if (tab === 'pbs') renderPBs();
            if (tab === 'bag') renderBagWorkout();
            if (tab === 'dashboard') renderHistory();
        }

        function renderBagWorkout() {
            document.getElementById('bag-content-container').innerHTML = `
                <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                    <label class="text-xs font-bold text-slate-600 uppercase block mb-2">Rounds</label>
                    <input type="number" id="bag-rounds" placeholder="5" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mb-4 text-lg font-bold outline-none focus:border-purple-500">
                    <label class="text-xs font-bold text-slate-600 uppercase block mb-2">Round Length (min)</label>
                    <input type="number" id="bag-length" placeholder="3" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 mb-4 text-lg font-bold outline-none focus:border-purple-500">
                    <button onclick="addBagSession()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl">
                        <i class="ph-bold ph-plus mr-2"></i>Log Session
                    </button>
                </div>
            `;
        }

        function addBagSession() {
            const r = parseInt(document.getElementById('bag-rounds').value);
            const l = parseInt(document.getElementById('bag-length').value);
            if (r && l) {
                const bagData = JSON.parse(localStorage.getItem('bagData') || '[]');
                bagData.unshift({ id: Date.now(), date: new Date().toISOString(), rounds: r, length: l });
                localStorage.setItem('bagData', JSON.stringify(bagData));
                renderBagWorkout();
                showMessage("Success", `Logged ${r} rounds of ${l} minutes!`);
            }
        }

        function renderPBs() {
            const exSet = new Set();
            historyData.forEach(s => s.exercises.forEach(e => exSet.add(e.name)));
            const exList = Array.from(exSet).sort();
            const container = document.getElementById('pb-content-container');

            if (exList.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-12 bg-white rounded-xl border border-dashed"><i class="ph-fill ph-trophy text-5xl mx-auto text-slate-300 mb-3"></i><p>No data yet</p></div>`;
                return;
            }

            container.innerHTML = `
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-4">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Select Exercise</label>
                    <select id="pb-select" onchange="updatePBChart()" class="w-full bg-slate-50 border border-slate-300 rounded-xl p-3 font-semibold outline-none">
                        ${exList.map(e => `<option value="${e}">${e}</option>`).join('')}
                    </select>
                </div>
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                    <h3 class="text-sm font-bold text-slate-400 uppercase mb-1">All-Time Max</h3>
                    <p id="pb-max" class="text-4xl font-black text-slate-900 mb-4">-- kg</p>
                    <div class="h-80 w-full"><canvas id="pbChart"></canvas></div>
                </div>
            `;
            updatePBChart();
        }

        function updatePBChart() {
            const sel = document.getElementById('pb-select');
            if (!sel) return;
            const exName = sel.value;
            
            const data = new Map();
            historyData.forEach(s => {
                const ex = s.exercises.find(e => e.name === exName);
                if (ex) {
                    const w = Math.max(...ex.sets.map(st => st.w || 0), 0);
                    const v = ex.sets.reduce((sum, st) => sum + ((st.w || 0) * (st.r || 0) * (st.s || 1)), 0);
                    const reps = ex.sets.reduce((sum, st) => sum + (st.r || 0), 0);
                    
                    if (w > 0 || v > 0) {
                        const key = new Date(s.date).toLocaleDateString('en-GB', { month: 'short', day: 'numeric' });
                        if (!data.has(key)) {
                            data.set(key, { date: key, ts: new Date(s.date).getTime(), w, v, reps });
                        } else {
                            const d = data.get(key);
                            d.w = Math.max(d.w, w);
                            d.v += v;
                            d.reps += reps;
                        }
                    }
                }
            });
            
            const chartData = Array.from(data.values()).sort((a, b) => a.ts - b.ts);
            const maxW = chartData.length > 0 ? Math.max(...chartData.map(d => d.w)) : 0;
            document.getElementById('pb-max').textContent = `${maxW} kg`;

            const ctx = document.getElementById('pbChart').getContext('2d');
            if (pbChartInstance) pbChartInstance.destroy();
            
            pbChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.map(d => d.date),
                    datasets: [
                        {
                            label: 'Total Volume (kg)',
                            data: chartData.map(d => d.v),
                            borderColor: '#06b6d4',
                            borderWidth: 3,
                            pointRadius: 4,
                            pointBackgroundColor: '#fff',
                            pointBorderColor: '#06b6d4',
                            yAxisID: 'y',
                            tension: 0.4
                        },
                        {
                            label: 'Peak Weight (kg)',
                            data: chartData.map(d => d.w),
                            borderColor: '#ef4444',
                            borderWidth: 3,
                            pointRadius: 4,
                            pointBackgroundColor: '#fff',
                            pointBorderColor: '#ef4444',
                            yAxisID: 'y1',
                            tension: 0.4
                        },
                        {
                            label: 'Total Reps',
                            data: chartData.map(d => d.reps),
                            borderColor: '#8b5cf6',
                            borderWidth: 3,
                            pointRadius: 4,
                            pointBackgroundColor: '#fff',
                            pointBorderColor: '#8b5cf6',
                            yAxisID: 'y1',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: true, position: 'top', labels: { usePointStyle: true, padding: 15, font: { size: 12, weight: 'bold' } } },
                        tooltip: { backgroundColor: '#1e293b', padding: 12, cornerRadius: 8, titleFont: { size: 13 }, bodyFont: { size: 12, weight: 'bold' } }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 11 } } },
                        y: { position: 'left', title: { display: true, text: 'Total Volume (kg)', color: '#06b6d4', font: { weight: 'bold' } }, grid: { color: '#f1f5f9' }, ticks: { color: '#06b6d4', font: { size: 11 } } },
                        y1: { position: 'right', title: { display: true, text: 'Peak Weight & Reps (kg / reps)', color: '#64748b', font: { weight: 'bold' } }, grid: { display: false }, ticks: { color: '#64748b', font: { size: 11 } } }
                    }
                }
            });
        }

        function showMessage(title, msg) {
            document.getElementById('modal-content').innerHTML = `
                <h2 class="text-xl font-bold text-slate-900 mb-2">${title}</h2>
                <p class="text-slate-700 mb-6">${msg}</p>
                <button onclick="document.getElementById('modal-overlay').classList.add('hidden')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg">OK</button>
            `;
            document.getElementById('modal-overlay').classList.remove('hidden');
        }

        function exportWorkoutData() {
            const bagData = localStorage.getItem('bagData');
            const data = { 
                historyData, 
                lastWorkoutTemplate, 
                bagSessions: bagData ? JSON.parse(bagData) : [],
                exportDate: new Date().toISOString(),
                version: '2.1'
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `workout-backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function importWorkoutData(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                try {
                    const imported = JSON.parse(evt.target.result);
                    
                    // Handle old backup format (string-based)
                    if (imported.workout_history && typeof imported.workout_history === 'string') {
                        const oldHistory = JSON.parse(imported.workout_history);
                        historyData = oldHistory.map(session => ({
                            id: session.id,
                            date: session.date,
                            type: session.split,
                            exercises: session.exercises.map(ex => ({
                                name: ex.name,
                                sets: ex.sets.map(s => ({ w: s.weight, r: s.reps, s: 1 }))
                            })),
                            rating: session.rating || null
                        }));
                        
                        // Update last workout template
                        oldHistory.slice(0, 3).forEach(session => {
                            if (session.split) {
                                lastWorkoutTemplate[session.split] = {
                                    id: session.id,
                                    date: session.date,
                                    type: session.split,
                                    exercises: session.exercises.map(ex => ({
                                        name: ex.name,
                                        sets: ex.sets.map(s => ({ w: s.weight, r: s.reps, s: 1 }))
                                    }))
                                };
                            }
                        });
                    } else if (imported.historyData) {
                        historyData = imported.historyData;
                    }
                    
                    // Handle template
                    if (imported.lastWorkoutTemplate) lastWorkoutTemplate = imported.lastWorkoutTemplate;
                    
                    // Handle bag sessions - multiple formats for backward compatibility
                    if (imported.bagSessions && Array.isArray(imported.bagSessions)) {
                        localStorage.setItem('bagData', JSON.stringify(imported.bagSessions));
                    } else if (imported.bagData && Array.isArray(imported.bagData)) {
                        localStorage.setItem('bagData', JSON.stringify(imported.bagData));
                    } else if (imported.bagData && typeof imported.bagData === 'string') {
                        localStorage.setItem('bagData', imported.bagData);
                    } else if (imported.bag_workout_history && typeof imported.bag_workout_history === 'string') {
                        localStorage.setItem('bagData', imported.bag_workout_history);
                    }
                    
                    saveData();
                    renderHistory();
                    showMessage("Success", "Data imported! ✓");
                } catch (err) {
                    showMessage("Error", "Failed to import: " + err.message);
                }
            };
            reader.readAsText(file);
        }

        window.onload = () => {
            loadData();
            switchTab('dashboard');
        };
    </script>
</body>
</html>
